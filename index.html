    <!-- Crisp Live Chat Widget Integration -->
    <script type="text/javascript">
      window.$crisp = [];
      window.$crisp.push(['safe', true]);
      window.CRISP_WEBSITE_ID = "458178db-b2c7-4e37-b759-d377ae93554a";
      window.addEventListener('error', function(e) {
        if (e && (e.message && (e.message.indexOf('Invalid data') !== -1 || e.message.indexOf('crisp') !== -1) || (e.filename && e.filename.indexOf('crisp.chat') !== -1))) {
          e.preventDefault && e.preventDefault();
          e.stopPropagation && e.stopPropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason && (reason.indexOf('Invalid data') !== -1 || reason.indexOf('crisp') !== -1)) {
          e.preventDefault && e.preventDefault();
          e.stopPropagation && e.stopPropagation();
        }
      });
      (function(){
        var d = document;
        var s = d.createElement("script");
        s.id = "crisp-chat-script";
        s.src = "https://client.crisp.chat/l.js";
        s.async = 1;
        d.getElementsByTagName("head")[0].appendChild(s);
      })();
    </script>
    <style id="crisp-floating-offset-style">
      :root, body, .crisp-client, .crisp-client * {
        --crisp-customization-default-button-vertical: 82px !important;
        --crisp-customization-mobile-button-vertical: 82px !important;
        --crisp-override-env-safe-area-inset-bottom: 82px !important;
      }
      .crisp-client .cc-13wro,
      .crisp-client .cc-165wh .cc-lk42u .cc-13wro,
      .crisp-client .cc-1x3z,
      .crisp-client .cc-tup6,
      .crisp-client [data-chat-status],
      .crisp-client [data-is-launcher="true"],
      .crisp-client .cc-1gfkz {
        bottom: calc(82px + env(safe-area-inset-bottom, 0px)) !important;
        margin-bottom: 0px !important;
        z-index: 45 !important;
      }
      .crisp-client .cc-165wh .cc-lk42u .cc-13wro .cc-11p4p .cc-l4wzd,
      .crisp-client .cc-l4wzd {
        bottom: calc(146px + env(safe-area-inset-bottom, 0px)) !important;
        margin-bottom: 0px !important;
      }
    </style>
