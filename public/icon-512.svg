<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042018" />
      <stop offset="100%" stop-color="#06483A" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners for PWA app icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="#00e676" opacity="0.08" />
  <circle cx="256" cy="256" r="140" fill="#00e676" opacity="0.12" />
  
  <!-- High voltage / energy bolt icon -->
  <path d="M280 60 L140 280 L250 280 L230 452 L372 232 L262 232 Z" fill="url(#boltGrad)" stroke="#00e676" stroke-width="8" stroke-linejoin="round" />
  
  <!-- NVT brand label -->
  <text x="256" y="480" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4">NVT ENERGY</text>
</svg>
